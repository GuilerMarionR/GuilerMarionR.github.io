}

let anonymousUser =
    localStorage.getItem(
        "anonymousUser"
    );


if (!anonymousUser) {

    anonymousUser =
        "anonymous_" +
        crypto.randomUUID();

    localStorage.setItem(
        "anonymousUser",
        anonymousUser
    );

}


let likes =
    JSON.parse(
        localStorage.getItem(
            "websiteLikes"
        )
    ) || {};


let views =
    JSON.parse(
        localStorage.getItem(
            "websiteViews"
        )
    ) || {};


let uniqueViewers =
    JSON.parse(
        localStorage.getItem(
            "uniqueViewers"
        )
    ) || {};



/* =====================================================
   SAVE DATA
===================================================== */

function saveData() {

    localStorage.setItem(

        "websiteLikes",

        JSON.stringify(likes)

    );


    localStorage.setItem(

        "websiteViews",

        JSON.stringify(views)

    );


    localStorage.setItem(

        "uniqueViewers",

        JSON.stringify(uniqueViewers)

    );

}



/* =====================================================
   LIKE / UNLIKE
===================================================== */

function toggleLike(
    websiteId
) {


    /*
       Create an object
       for this website.
    */

    if (!likes[websiteId]) {

        likes[websiteId] = {};

    }


    /*
       Check whether this
       anonymous browser has
       already liked the website.
    */

    if (
        likes[websiteId][anonymousUser]
    ) {


        /* UNLIKE */

        delete likes[
            websiteId
        ][
            anonymousUser
        ];

    }

    else {


        /* LIKE */

        likes[
            websiteId
        ][
            anonymousUser
        ] = true;

    }


    saveData();


    updateWebsite(
        websiteId
    );

}



/* =====================================================
   VISIT WEBSITE
===================================================== */

function visitWebsite(
    websiteId,
    url
) {


    /*
       Increase total view count.
    */

    if (!views[websiteId]) {

        views[websiteId] = 0;

    }


    views[websiteId]++;


    /*
       Record anonymous visitor.

       This allows us to count
       unique anonymous browsers.
    */

    if (
        !uniqueViewers[
            websiteId
        ]
    ) {

        uniqueViewers[
            websiteId
        ] = {};

    }


    uniqueViewers[
        websiteId
    ][
        anonymousUser
    ] = true;


    saveData();


    updateWebsite(
        websiteId
    );


    /*
       Open the website.
    */

    window.open(
        url,
        "_blank"
    );

}



/* =====================================================
   GET LIKE COUNT
===================================================== */

function getLikeCount(
    websiteId
) {

    if (
        !likes[websiteId]
    ) {

        return 0;

    }


    return Object.keys(
        likes[websiteId]
    ).length;

}



/* =====================================================
   GET VIEW COUNT
===================================================== */

function getViewCount(
    websiteId
) {

    return (
        views[websiteId] || 0
    );

}



/* =====================================================
   GET UNIQUE VIEWERS
===================================================== */

function getUniqueViewerCount(
    websiteId
) {

    if (
        !uniqueViewers[
            websiteId
        ]
    ) {

        return 0;

    }


    return Object.keys(
        uniqueViewers[
            websiteId
        ]
    ).length;

}



/* =====================================================
   CHECK USER LIKE
===================================================== */

function userLiked(
    websiteId
) {

    return (

        likes[websiteId] &&

        likes[websiteId][
            anonymousUser
        ]

    );

}



/* =====================================================
   UPDATE WEBSITE CARD
===================================================== */

function updateWebsite(
    websiteId
) {


    const likeCount =
        getLikeCount(
            websiteId
        );


    const viewCount =
        getViewCount(
            websiteId
        );


    const uniqueCount =
        getUniqueViewerCount(
            websiteId
        );


    const likeNumber =
        document.getElementById(
            "likes-" +
            websiteId
        );


    const viewNumber =
        document.getElementById(
            "views-" +
            websiteId
        );


    const uniqueNumber =
        document.getElementById(
            "unique-" +
            websiteId
        );


    const likeButton =
        document.getElementById(
            "like-" +
            websiteId
        );


    /*
       Update counts.
    */

    if (likeNumber) {

        likeNumber.textContent =
            likeCount;

    }


    if (viewNumber) {

        viewNumber.textContent =
            viewCount;

    }


    if (uniqueNumber) {

        uniqueNumber.textContent =
            uniqueCount;

    }


    /*
       Update Like icon.
    */

    if (likeButton) {


        const icon =
            likeButton.querySelector(
                "i"
            );


        if (
            userLiked(
                websiteId
            )
        ) {

            likeButton.classList.add(
                "liked"
            );


            icon.className =
                "bi bi-heart-fill";

        }

        else {

            likeButton.classList.remove(
                "liked"
            );


            icon.className =
                "bi bi-heart";

        }

    }

}



/* =====================================================
   CREATE WEBSITE CARD
===================================================== */

function createWebsiteCard(
    website
) {

    return `

        <div class="col-md-6 col-lg-3">

            <div class="website-card">


                <!-- WEBSITE ICON -->

                <div class="website-icon">

                </div>

                <div class="website-name">

                    ${website.name}

                </div>


                <!-- DESCRIPTION -->

                <p class="website-description">

                    ${website.description}

                </p>


                <!-- ACTIONS -->

                <div class="card-actions">


                    <!-- LIKE -->

                    <button

                        id="like-${website.id}"

                        class="icon-action like-action"

                        onclick="
                            toggleLike(
                                '${website.id}'
                            )
                        "

                        title="Like this website"

                    >

                        <i
                            class="bi bi-heart"
                        ></i>


                        <span
                            id="likes-${website.id}"
                        >
                            0
                        </span>

                    </button>



                    <!-- UNIQUE USERS -->

                    <span

                        class="icon-action"

                        title="Anonymous users"

                    >

                        <i
                            class="bi bi-people"
                        ></i>


                        <span
                            id="unique-${website.id}"
                        >
                            0
                        </span>

                    </span>



                    <!-- VIEWS -->

                    <button

                        class="icon-action view-action"

                        onclick="
                            visitWebsite(
                                '${website.id}',
                                '${website.url}'
                            )
                        "

                        title="Visit website"

                    >

                        <i
                            class="bi bi-eye"
                        ></i>


                        <span
                            id="views-${website.id}"
                        >
                            0
                        </span>

                    </button>


                </div>

            </div>

        </div>

    `;

}



/* =====================================================
   RENDER WEBSITES
===================================================== */

function renderAll() {


    /*
       Get Skillfulness websites.
    */

    const skillfulness =
        websites.filter(
            website =>
                website.category ===
                "skillfulness"
        );


    /*
       Get Stability websites.
    */

    const stability =
        websites.filter(
            website =>
                website.category ===
                "stability"
        );


    /*
       Render Skillfulness.
    */

    document.getElementById(
        "skillfulnessList"
    ).innerHTML =

        skillfulness
            .map(
                createWebsiteCard
            )
            .join("");


    /*
       Render Stability.
    */

    document.getElementById(
        "stabilityList"
    ).innerHTML =

        stability
            .map(
                createWebsiteCard
            )
            .join("");


    /*
       Update all counters.
    */

    websites.forEach(
        website => {

            updateWebsite(
                website.id
            );

        }
    );

}

===================================================== */

const elements = [
    {
        tag: "h1",
        text: "Grade 12 TVL ICT OFF CAMPUS BASED ACTIVITY"
    },
    {
        tag: "p",
        text: "Explore the websites created by 12 TVL ICT students based on their experiences during their Off-Campus Activity. Take some time to visit their websites, learn about their experiences, and appreciate the creativity and effort they put into presenting their journey. While visiting each website, you may also like the websites you enjoyed or found interesting by clicking the Like button."
    },
    {
        tag: "small",
        text: "Likes and views are anonymous."
    }
];

const container = document.getElementById("typing-container");

let elementIndex = 0;
let charIndex = 0;
const speed = 30;

function typeElement() {

    if (elementIndex >= elements.length) {
        return;
    }

    const current = elements[elementIndex];

    // Create the HTML element
    if (charIndex === 0) {
        const newElement = document.createElement(current.tag);

        if (current.tag === "small") {
            const icon = document.createElement("i");
            icon.className = "bi bi-incognito";
            newElement.appendChild(icon);
            newElement.appendChild(document.createTextNode(" "));
        }

        container.appendChild(newElement);
    }

    const currentElement = container.lastElementChild;

    if (charIndex < current.text.length) {

        currentElement.appendChild(
            document.createTextNode(current.text.charAt(charIndex))
        );

        charIndex++;

        setTimeout(typeElement, speed);

    } else {

        // Move to the next element
        elementIndex++;
        charIndex = 0;

        setTimeout(typeElement, 500);
    }
}

typeElement();
window.addEventListener("load", function () {

    const loadingScreen =
        document.getElementById("loading-screen");

    loadingScreen.classList.add("hide");

});


</script>
<script>

const themeToggle =
    document.getElementById("theme-toggle");

const themeIcon =
    themeToggle.querySelector("i");


// LOAD SAVED THEME

const savedTheme =
    localStorage.getItem("theme");

if (savedTheme === "dark") {

    document.body.classList.add("dark-mode");

    themeIcon.classList.remove("bi-moon-fill");
    themeIcon.classList.add("bi-sun-fill");

}


// TOGGLE THEME

themeToggle.addEventListener("click", function () {

    document.body.classList.toggle("dark-mode");


    const isDark =
        document.body.classList.contains("dark-mode");


    // CHANGE ICON

    if (isDark) {

        themeIcon.classList.remove("bi-moon-fill");
        themeIcon.classList.add("bi-sun-fill");

        localStorage.setItem("theme", "dark");

    } else {

        themeIcon.classList.remove("bi-sun-fill");
        themeIcon.classList.add("bi-moon-fill");

        localStorage.setItem("theme", "light");

    }

});

</script>
